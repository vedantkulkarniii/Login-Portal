<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Status</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        /* Specific styles for the result page to ensure only image is shown centrally */
        body.result-page {
            background-color: #000;
            /* Dark background for focus */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #resultContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            box-shadow: none;
        }

        .loading-text {
            color: #fff;
            /* Make loading text visible on black */
        }

        .meme-full-screen {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .result-meme-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-footer {
            color: #ccc;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            font-family: monospace;
            width: 100%;
            position: absolute;
            bottom: 2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        .top-overlay-text {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 20;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body class="result-page">
    <div id="resultContainer">
        <!-- Loading State -->
        <div class="loading-container">
            <div class="spinner"></div>
            <p class="loading-text">Fetching University Database...</p>
        </div>

        <!-- Result/Prank State -->
        <div class="result-meme-container" style="display: none;">

            <img src="meme_image.png" alt="Result" class="meme-full-screen">
        </div>
    </div>
</body>

</html>
